[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-sample"
description = ""
authors = [
    { name = "Zheng Zhu", email = "zzhu8192@gmail.com" }
]
requires-python = ">=3.11"
readme = "README.md"
# see setup.py
dynamic = ["version"]
dependencies = [
    "dbt-core>=1.11.2", 
    "dbt-spark[PyHive]>=1.10.0", 
    "dbt-spark[session]>=1.10.0"
