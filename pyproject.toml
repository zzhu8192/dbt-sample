[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-sample"
version = "0.1.0"
description = "Demonstration of dbt with proper dependency management via uv, Spark backend, and comprehensive testing"
authors = [
    { name = "Zheng Zhu", email = "zzhu8192@gmail.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "dbt-core>=1.11.2",
    "dbt-spark[PyHive]>=1.10.0",
    "dbt-spark[session]>=1.10.0"
]

[dependency-groups]
test = []

[tool.uv]
package = false

[tool.setuptools]
packages = []
