version: 2

# Common columns with contracts and data tests
std_claim_line_columns: &std_claim_line_columns
  - name: claim_id
    description: "claim id"
    data_type: bigint
    data_tests:
      - not_null
      - unique

  - name: patient_id
    description: "patient_id as int"
    data_type: bigint
    data_tests:
      - not_null

  - name: claim_amount
    description: "amount"
    data_type: double
    data_tests:
      - not_null
      - expression_is_true:
          arguments:
            expression: "claim_amount >= 0"

  - name: diagnosis_code
    description: "diagnosis_code"
    data_type: string
    data_tests:
      - not_null

  - name: service_date
    description: "service date"
    data_type: date
    data_tests:
      - not_null

# YAML anchors (&alias / *alias) are resolved by the YAML parser, not dbt. Anchors exist only within a single file
models:
  - name: payer01__claim
    description: "payer01 version of claim"
    config:
      contract:
        enforced: true
    columns: *std_claim_line_columns  

  - name: payer02__claim
    description: "payer02 version of claim"
    config:
      contract:
        enforced: true
    columns: *std_claim_line_columns

